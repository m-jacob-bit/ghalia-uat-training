<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>تقييم مشروع ابنتي الغالية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Almarai:wght@300;400;700;800&display=swap">
<style id="app-style">
:root{
  --bg:#f7f7fb;
  --surface:#ffffff;
  --surface-2:#f1f1f8;
  --border:#e3e3ee;
  --text:#1c1b29;
  --text-muted:#6b6b7f;
  --text-faint:#9a99ad;
  --primary:#4338ca;
  --primary-hover:#3730a3;
  --primary-soft:#eef0fd;
  --amber:#f59e0b;
  --success:#16a34a;
  --success-soft:#dcfce7;
  --warning:#d97706;
  --warning-soft:#fef3c7;
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --neutral:#6b7280;
  --neutral-soft:#e5e7eb;
  --shadow:0 1px 2px rgba(28,27,41,.06),0 8px 24px -12px rgba(28,27,41,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131220;
    --surface:#1b1a2c;
    --surface-2:#211f36;
    --border:#312e4d;
    --text:#eeedf7;
    --text-muted:#a6a4c0;
    --text-faint:#7d7b98;
    --primary:#8385f5;
    --primary-hover:#9698ff;
    --primary-soft:#26234a;
    --amber:#fbbf24;
    --success:#4ade80;
    --success-soft:#153524;
    --warning:#fbbf24;
    --warning-soft:#3a2c0c;
    --danger:#f87171;
    --danger-soft:#3b1a1a;
    --neutral:#9c9bb5;
    --neutral-soft:#2a2843;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#131220;
  --surface:#1b1a2c;
  --surface-2:#211f36;
  --border:#312e4d;
  --text:#eeedf7;
  --text-muted:#a6a4c0;
  --text-faint:#7d7b98;
  --primary:#8385f5;
  --primary-hover:#9698ff;
  --primary-soft:#26234a;
  --amber:#fbbf24;
  --success:#4ade80;
  --success-soft:#153524;
  --warning:#fbbf24;
  --warning-soft:#3a2c0c;
  --danger:#f87171;
  --danger-soft:#3b1a1a;
  --neutral:#9c9bb5;
  --neutral-soft:#2a2843;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Almarai','Cairo',sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh}
h1,h2,h3,h4{font-family:'Cairo','Almarai',sans-serif;text-wrap:balance;margin:0}
button{font-family:inherit}
a{color:var(--primary)}
::selection{background:var(--primary-soft)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.panel{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:36px 32px}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;flex-shrink:0}
.brand-text .ar{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:var(--text)}
.brand-text .en{font-size:12px;color:var(--text-faint);letter-spacing:.03em}
.panel h1{font-size:22px;font-weight:800;margin-bottom:8px}
.panel .lead{color:var(--text-muted);margin-bottom:22px;font-size:14.5px}
.field-group{margin-bottom:16px}
.field-label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--text)}
.field-label .opt{font-weight:400;color:var(--text-faint);font-size:12px}
.field-label .req{color:var(--danger);margin-inline-start:2px}
.field-hint{font-size:12px;color:var(--text-faint);margin-top:4px}
.field-error{font-size:12.5px;color:var(--danger);margin-top:5px;display:flex;align-items:center;gap:5px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);
  color:var(--text);font-size:14.5px;font-family:inherit;transition:border-color .12s;
}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6b7f' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 12px center;padding-inline-start:34px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
input.error,select.error{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:9px;font-size:14.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer;transition:transform .06s,background .12s,border-color .12s;font-family:'Cairo','Almarai',sans-serif;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{background:var(--primary-soft);color:var(--text-faint);cursor:not-allowed}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent;padding:8px 12px}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:13px}

.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:2px}
.sidebar.collapsed{width:64px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:600;border:none;background:none;width:100%;text-align:right;font-family:inherit}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-sub{padding-inline-start:20px;display:flex;flex-direction:column;gap:2px;margin-top:2px;margin-bottom:4px}
.nav-sub .nav-item{font-size:13.5px;padding:8px 12px}
.nav-group-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:600;user-select:none}
.nav-group-toggle:hover{background:var(--surface-2)}
.nav-chevron{transition:transform .15s}
.nav-chevron.open{transform:rotate(90deg)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cairo',sans-serif;font-size:13px;flex-shrink:0}
.content{flex:1;padding:26px 30px;overflow-x:auto}
.content-inner{max-width:1080px}

.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:800}
.tab-toggle{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.tab-toggle button{border:none;background:none;padding:8px 16px;border-radius:7px;font-weight:700;font-size:13.5px;color:var(--text-muted);cursor:pointer;font-family:'Cairo',sans-serif}
.tab-toggle button.active{background:var(--primary);color:#fff}

.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);font-size:13px;font-weight:700;border:1.5px solid transparent;cursor:default}
.chip .n{font-variant-numeric:tabular-nums;margin-inline-start:4px;opacity:.75}
.chip.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.search-row{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.search-row input{flex:1}

table{width:100%;border-collapse:collapse;font-size:13.8px}
th{text-align:right;padding:11px 14px;color:var(--text-faint);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.name-cell{font-weight:700}
.empty-state{padding:56px 20px;text-align:center;color:var(--text-faint)}
.empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.5}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.badge .dot{width:6px;height:6px;border-radius:50%}
.badge-approved{background:var(--success-soft);color:var(--success)}
.badge-approved .dot{background:var(--success)}
.badge-review{background:var(--warning-soft);color:var(--warning)}
.badge-review .dot{background:var(--warning)}
.badge-returned{background:var(--warning-soft);color:var(--warning)}
.badge-returned .dot{background:var(--danger)}
.badge-rejected{background:var(--danger-soft);color:var(--danger)}
.badge-rejected .dot{background:var(--danger)}
.badge-draft{background:var(--neutral-soft);color:var(--neutral)}
.badge-draft .dot{background:var(--neutral)}

.kebab-wrap{position:relative;display:inline-block}
.kebab-btn{width:30px;height:30px;border-radius:7px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:18px}
.kebab-btn:hover{background:var(--surface-2)}
.kebab-menu{position:absolute;left:0;top:34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:40;min-width:210px;padding:6px;text-align:right}
.kebab-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;text-align:right;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
.kebab-menu button:hover{background:var(--surface-2)}
.kebab-menu button.danger{color:var(--danger)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,14,25,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:460px;box-shadow:var(--shadow);overflow:hidden}
.modal-header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:18px 20px;font-size:14px;color:var(--text-muted);line-height:1.7}
.modal-body strong{color:var(--text)}
.modal-footer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);justify-content:flex-end}

.drawer-overlay{position:fixed;inset:0;background:rgba(15,14,25,.42);z-index:90;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:18px}
.close-x:hover{background:var(--surface-2)}
.drawer-body{flex:1;overflow-y:auto;padding:22px}
.drawer-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0}

.stepper{display:flex;align-items:center;gap:0;margin-bottom:26px}
.step{display:flex;align-items:center;gap:9px}
.step-circle{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step.active .step-circle{background:var(--primary);color:#fff}
.step.done .step-circle{background:var(--success);color:#fff}
.step-label{font-size:12.5px;font-weight:700;color:var(--text-faint)}
.step.active .step-label{color:var(--text)}
.step-line{flex:1;height:1.5px;background:var(--border);margin:0 10px;min-width:20px}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.field-grid{grid-template-columns:1fr}}
.readonly-field{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--text-muted)}
.radio-row{display:flex;gap:18px;margin-top:4px}
.radio-opt{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.radio-opt input{width:16px;height:16px}

.upload-grid{display:flex;flex-direction:column;gap:10px}
.upload-box{border:1.5px dashed var(--border);border-radius:10px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;background:var(--surface-2)}
.upload-box.done{border-style:solid;border-color:var(--success);background:var(--success-soft)}
.upload-label{font-size:13.5px;font-weight:700}
.upload-label .req{color:var(--danger)}
.upload-status{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px}
.upload-box.done .upload-status{color:var(--success);font-weight:700}
.upload-remove{width:22px;height:22px;border-radius:6px;border:none;background:none;color:var(--danger);cursor:pointer;font-size:15px;flex-shrink:0}

.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;background:var(--success-soft);color:var(--success);border:1px solid var(--success);border-radius:10px;padding:13px 18px;font-size:13.8px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow);max-width:520px}
.toast .close-x{color:var(--success)}
.validation-banner{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px}
.warn-banner{background:var(--warning-soft);border:1px solid var(--warning);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:11px;margin-bottom:16px}
.warn-banner .ic{color:var(--warning);flex-shrink:0}
.warn-banner-title{font-weight:800;font-size:13.8px;margin-bottom:2px}
.warn-banner-body{font-size:13px;color:var(--text-muted)}

.link-picker-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:8px}
.link-picker-col{flex:1}
.picker-box{border:1.5px solid var(--border);border-radius:9px;position:relative}
.picker-input{border:none !important;box-shadow:none !important}
.picker-list{position:absolute;top:calc(100% + 4px);right:0;left:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);z-index:30;max-height:220px;overflow-y:auto}
.picker-item{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--border)}
.picker-item:last-child{border-bottom:none}
.picker-item:hover{background:var(--surface-2)}
.picker-item .id{color:var(--text-faint);font-size:11.5px;margin-inline-start:6px}
.progress-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:14px 0}
.progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .25s}
.pair-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;font-size:13.5px}

.story-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.story-card{max-width:640px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.story-head{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;padding:26px 30px}
.story-eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;opacity:.85;text-transform:uppercase}
.story-title{font-size:23px;font-weight:800;margin-top:6px}
.story-body{padding:26px 30px}
.story-text{font-size:14.5px;line-height:1.85;color:var(--text)}
.casefile{background:var(--surface-2);border-radius:12px;padding:16px 18px;margin-top:18px}
.casefile-title{font-size:12.5px;font-weight:800;color:var(--text-faint);margin-bottom:10px;letter-spacing:.02em}
.casefile-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.casefile-row:last-child{border-bottom:none}
.casefile-row .k{color:var(--text-muted)}
.casefile-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.story-foot{padding:20px 30px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

.result-shell{min-height:100vh;padding:32px 16px;display:flex;justify-content:center}
.result-wrap{max-width:640px;width:100%}
.score-hero{text-align:center;padding:30px 20px}
.score-ring{width:130px;height:130px;margin:0 auto 14px;position:relative}
.score-num{font-family:'Cairo',sans-serif;font-weight:800;font-size:30px}
.score-label{font-size:13px;color:var(--text-muted);margin-top:4px}
.checklist{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.checklist-item{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.checklist-item .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}
.checklist-item.ok .ic{background:var(--success)}
.checklist-item.bad .ic{background:var(--danger)}
.checklist-item .txt .t{font-weight:700;font-size:13.8px}
.checklist-item .txt .d{font-size:12.8px;color:var(--text-muted);margin-top:2px}

.report-mission{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.report-mission:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.report-mission-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.report-mission-head .t{font-family:'Cairo',sans-serif;font-weight:700;font-size:15px}
.report-mission-head .s{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px}
.report-actions{border-top:1px solid var(--border);padding-top:20px}

@media print{
  body *{visibility:hidden}
  .print-area, .print-area *{visibility:visible}
  .print-area{position:absolute;inset:0 auto auto 0;width:100%;margin:0;padding:0;max-width:none}
  .no-print{display:none !important}
  .card{box-shadow:none;border:none}
  body{background:#fff;color:#000}
  .checklist-item{break-inside:avoid;border-color:#ccc}
  .report-mission{break-inside:avoid}
}

.mission-progress{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.mp-dot{width:9px;height:9px;border-radius:50%;background:var(--surface-2)}
.mp-dot.done{background:var(--success)}
.mp-dot.current{background:var(--primary)}

.roster-table-wrap{overflow-x:auto}
.login-lock{max-width:380px;margin:0 auto}

@media (max-width:760px){
  .shell{flex-direction:column;min-height:100vh}
  .sidebar{width:100% !important;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-inline-end:none;border-bottom:1px solid var(--border);gap:6px;flex-shrink:0}
  .sidebar-brand{display:none}

  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return d+' / '+m+' / '+y;
}
function normalize(s){ return String(s==null?'':s).trim().replace(/\s+/g,' '); }

function wd(field, def){ return state.wizardData[field]!==undefined ? state.wizardData[field] : (def||''); }

    return `

      ${selectRow('الشعبة','department',DEPARTMENTS,{required:true})}
      ${selectRow('الفرقة','year',UNI_YEARS,{required:true})}
      ${selectRow('الدورة','cycle',CYCLES,{required:true})}
      ${radioRow('هل شاركت في مشروع ابنتي الغالية من قبل؟','participatedBefore',YES_NO,{required:true})}
      ${radioRow('الدور','role',ROLES,{required:true})}
    </div>`;
  }
  return `

  </div>`;
}
function renderWizardStep3(kind){
  const attachments = kind==='big'? BIG_ATTACHMENTS: LITTLE_ATTACHMENTS;
  return `
  <div class="upload-grid">
    ${attachments.map(a=>{
      const done = !!wd('att_'+a.key, false);
      return `<div class="upload-box ${done?'done':''}" data-action="toggle-attachment" data-key="${a.key}">
        <div class="upload-label">${esc(a.label)}${a.required?' <span class="req">*</span>':''}</div>
        <div class="upload-status">${done?`✓ تم إرفاق الملف`:'اضغط لإرفاق ملف'}${done?`<button class="upload-remove" data-action="toggle-attachment" data-key="${a.key}" title="إزالة">✕</button>`:''}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function wizardStepValid(kind, step){
  if(step===1){
    const required = ['name','nationalId','dob','entryDate','governorate','center'];
    if(kind==='big'){ required.push('phone','email'); }
    for(const f of required){ if(!normalize(wd(f,''))) return false; }
    if(!/^\d{14}$/.test(normalize(wd('nationalId','')))) return false;
    if(kind==='big' && !/^(010|011|012|015)\d{8}$/.test(normalize(wd('phone','')))) return false;
    if(normalize(wd('name','')).length < 11) return false;
    return true;
  }
  if(step===2){
    if(kind==='big'){
      return !!(wd('uniType')&&wd('university')&&wd('college')&&wd('department')&&wd('year')&&wd('cycle')&&wd('participatedBefore')&&wd('role'));
    }
    return !!(wd('school')&&wd('grade')&&wd('participatedBefore'));
  }
  if(step===3){
    const attachments = kind==='big'? BIG_ATTACHMENTS: LITTLE_ATTACHMENTS;
    return attachments.filter(a=>a.required).every(a=>!!wd('att_'+a.key,false));
  }
  return true;
}
function renderWizardDrawer(kind, isComplete){
  const meta = wizardMeta(kind, isComplete);
  const step = state.drawerStep;
  let body='';
  if(step===1) body = renderWizardStep1(kind);
  else if(step===2) body = renderWizardStep2(kind);
  else body = renderWizardStep3(kind);
  const canAdvance = wizardStepValid(kind, step);
  const isLast = step===3;
  return `
  <div class="drawer-overlay" data-action="noop">
    <div class="drawer">
      <div class="drawer-header">
        <div class="drawer-title">🔗 ${esc(meta.title)}</div>
        <button class="close-x" data-action="close-drawer">✕</button>
      </div>
      <div class="drawer-body">
        <div class="stepper">
          ${meta.steps.map((s,i)=>{
            const n=i+1; const cls = n<step?'done':(n===step?'active':'');
            return `<div class="step ${cls}"><div class="step-circle">${n<step?'✓':n}</div><div class="step-label">${esc(s)}</div></div>${i<2?'<div class="step-line"></div>':''}`;
          }).join('')}
        </div>
        ${body}
      </div>
      <div class="drawer-footer">
        <div>
          ${step>1?`<button class="btn btn-outline" data-action="wizard-prev">السابق</button>`:''}
          <button class="btn btn-ghost" data-action="wizard-draft">حفظ كمسودة</button>
        </div>
        ${isLast?
          `<button class="btn btn-primary" data-action="wizard-submit" ${canAdvance?'':'disabled'}>إرسال الطلب</button>`:
          `<button class="btn btn-primary" data-action="wizard-next" ${canAdvance?'':'disabled'}>التالي</button>`
        }
      </div>
    </div>
  </div>`;
}

/* ---------- mission scoring ---------- */
function scoreAddMission(kind, mission){
  const exp = mission.expected;
  const fieldChecks = kind==='big' ? [
    ['name','اسم الأخت رباعي'],['nationalId','الرقم القومي'],['dob','تاريخ الميلاد'],['phone','رقم التواصل'],['email','البريد الإلكتروني'],
    ['entryDate','تاريخ الدخول'],['governorate','المحافظة'],['center','المركز'],['village','القرية'],['uniType','نوع الجامعة'],
    ['university','الجامعة'],['college','الكلية'],['department','الشعبة'],['year','الفرقة'],['participatedBefore','شاركت من قبل؟'],['role','الدور'],['cycle','الدورة']
  ] : [
    ['name','اسم الأخت الصغرى رباعي'],['nationalId','الرقم القومي'],['dob','تاريخ الميلاد'],['phone','رقم التواصل'],
    ['entryDate','تاريخ الدخول'],['governorate','المحافظة'],['center','المركز'],['village','القرية'],
    ['school','المدرسة'],['grade','الصف الدراسي'],['participatedBefore','شاركت من قبل؟']
  ];
  const submitted = state.flags['submitted_'+mission.id];
  const finalData = state.flags['finalData_'+mission.id] || {};
  let correct=0;
  const items = fieldChecks.map(([f,label])=>{
    const ok = submitted && fieldsMatch(finalData[f], exp[f]);
    if(ok) correct++;
    const entered = submitted ? (finalData[f]||'(تُركت فارغة)') : '(لم تصل هذه الخانة لأنك لم ترسلي الطلب)';
    return {label, ok, detail: ok? '' : `أدخلتِ «${entered}»، والصحيح المطلوب في بيانات الحالة هو «${exp[f]}». راجعي بيانات الحالة قبل تعبئة هذه الخانة.`};
  });
  const accuracyPct = Math.round((correct/fieldChecks.length)*100);
  const completion = submitted? 100 : (state.flags['draft_'+mission.id]? 50 : 0);
  const overall = submitted ? Math.round(accuracyPct*0.8 + completion*0.2) : Math.round(accuracyPct*0.5);
  items.push({label:'إرسال الطلب فعليًا (وليس حفظه كمسودة فقط)', ok:submitted, detail: submitted? '' : (state.flags['draft_'+mission.id]?'حفظتِ البيانات كمسودة وتوقفتِ هناك — لازم تضغطي زر الإرسال النهائي عشان يُعتبر الطلب مكتملًا ويُحتسب لكِ.':'لم تبدئي إرسال الطلب أصلًا — افتحي شاشة التسجيل واملئي البيانات ثم أرسليها.')});
  return {score: overall, items};
}
function scoreLinkMission(mission){
  const exp = mission.expected;
  const links = state.data.links;
  const correctPair = links.find(l=>l.bigId===exp.bigId && l.littleId===exp.littleId);
  const extraWrong = links.filter(l=>!(l.bigId===exp.bigId && l.littleId===exp.littleId));
  const items = [
    {label:'ربط الأخت الكبرى الصحيحة بالأخت الصغرى الصحيحة', ok: !!correctPair, detail: correctPair? `تم ربط "${exp.bigName}" بـ"${exp.littleName}" بنجاح.` : `المطلوب: ربط "${exp.bigName}" بـ"${exp.littleName}". لم يتم إنشاء هذا الربط بالتحديد — تأكدي من اختيار نفس السجلين اللي سجّلتيهم في المهمتين السابقتين.`},
    {label:'عدم إنشاء روابط إضافية غير مطلوبة', ok: extraWrong.length===0, detail: extraWrong.length? `تم إنشاء ${extraWrong.length} رابط إضافي (${extraWrong.map(l=>`"${l.bigName}" × "${l.littleName}"`).join('، ')}) غير مطلوب في هذه المهمة — الرابط المطلوب واحد بس.` : ''},
    {label:'تأكيد الربط (تأكيد الربط ✈)', ok: !!state.flags.linkConfirmed, detail: state.flags.linkConfirmed? '' : 'تم إنشاء الرابط لكن لم يتم الضغط على «تأكيد الربط» — الربط لسه مش نهائي.'}
  ];
  let score = 0;
  if(correctPair) score += 55;
  if(extraWrong.length===0) score += 20;
  if(state.flags.linkConfirmed) score += 25;
  return {score, items};
}
function scoreCompleteMission(mission){
  const rec = state.data.bigSisters.find(b=>b.id===mission.expected.targetId);
  const items = [
    {label:'فتح الطلب الصحيح (مريم عادل نصيف كامل — معاد للتعديل)', ok: !!state.flags.completeOpenedCorrect, detail: state.flags.completeOpenedCorrect? '' : 'لم يتم فتح الطلب الصحيح — في قائمة الطلبات، ابحثي عن «مريم عادل نصيف كامل» بحالة «معاد للتعديل» وافتحيه، مش أي طلب تاني.'},
    {label:'استخدام إجراء «استكمال الطلب» وليس «عرض التفاصيل» فقط', ok: !!state.flags.completeUsedRightMenu, detail: state.flags.completeUsedRightMenu? '' : 'مجرد عرض تفاصيل الطلب لا يكفي لتعديله — لازم تختاري تحديدًا خيار «استكمال الطلب» من قائمة الإجراءات.'},
    {label:'استبدال صورة بطاقة الرقم القومي الناقصة', ok: !!(rec && rec.attachments && rec.attachments.idFront), detail: (rec && rec.attachments && rec.attachments.idFront)? '' : 'الطلب أُعيد للتعديل بسبب نقص صورة بطاقة الرقم القومي — كان لازم ترفعي الصورة الناقصة قبل إعادة الإرسال.'},
    {label:'إعادة إرسال الطلب', ok: !!state.flags.completeSubmitted, detail: state.flags.completeSubmitted? '' : 'بعد تعديل الطلب، لازم تضغطي زر إعادة الإرسال — التعديل وحده من غير إرسال لا يُحدّث حالة الطلب.'}
  ];
  const score = Math.round(items.filter(i=>i.ok).length / items.length * 100);
  return {score, items};
}
function scoreExitMission(mission){
  const exp = mission.expected;
  const rec = state.data.bigSisters.find(b=>b.id===exp.targetId);
  const correctTarget = !!state.flags.exitCorrectTarget;
  const correctReason = fieldsMatch(state.flags.exitReasonUsed, exp.reason);
  const correctDate = state.flags.exitDateUsed===exp.exitDate;
  const submitted = !!state.flags.exitSubmitted;
  const items = [
    {label:'اختيار الأخت الكبرى الصحيحة (نيفين رمزي إبراهيم صليب)', ok: correctTarget, detail: correctTarget? '' : 'تم تقديم طلب الخروج لسجل مختلف عن المطلوب — تأكدي من الرقم القومي المذكور في بيانات الحالة قبل اختيار السجل، خصوصًا لو في أكتر من سجل بنفس الاسم.'},
    {label:'اختيار سبب الخروج الصحيح (الزواج)', ok: correctReason, detail: correctReason? '' : `اخترتِ السبب «${state.flags.exitReasonUsed||'لم يُختر أي سبب'}»، والصحيح المطلوب في بيانات الحالة هو «الزواج».`},
    {label:'إدخال تاريخ الخروج الصحيح (30/09/2026)', ok: correctDate, detail: correctDate? '' : `أدخلتِ التاريخ «${fmtDate(state.flags.exitDateUsed)||'لم يُدخل'}»، والتاريخ الصحيح المذكور في بيانات الحالة هو 30/09/2026.`},
    {label:'إرسال الطلب وتأكيده', ok: submitted, detail: submitted? '' : 'تعبئة النموذج وحدها لا تكفي — لازم تضغطي زر الإرسال وتؤكدي طلب الخروج حتى يُحتسب.'}
  ];
  const score = Math.round(items.filter(i=>i.ok).length / items.length * 100);
  return {score, items};
}
function computeMissionScore(idx){
  const m = MISSIONS[idx];
  if(m.id==='add-big') return scoreAddMission('big', m);
  if(m.id==='add-little') return scoreAddMission('little', m);
  if(m.id==='link') return scoreLinkMission(m);
  if(m.id==='complete') return scoreCompleteMission(m);
  if(m.id==='exit') return scoreExitMission(m);
}

/* ---------- mission result / final report ---------- */
function scoreColor(score){
  if(score>=85) return 'var(--success)';
  if(score>=60) return 'var(--warning)';
  return 'var(--danger)';
}
function ringSvg(score, size){
  size = size||130;
  const r = size/2 - 9;
  const c = 2*Math.PI*r;
  const off = c - (score/100)*c;
  const color = scoreColor(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

/* ---------- actions ---------- */
function toast(msg){ state.toast = msg; render(); setTimeout(()=>{ if(state.toast===msg){ state.toast=null; render(); } }, 4500); }

function startAssessment(){
  if(!normalize(state.traineeName)){ toast('برجاء إدخال الاسم أولاً'); return; }
  state.screen='mission-intro';
  state.missionIdx=0;
  render();
}
function beginMission(){
  const m = MISSIONS[state.missionIdx];
  state.screen='app';
  state.appScreen=m.startAppScreen;
  state.drawer=null;
  render();
}
function finishCurrentMission(){
  const res = computeMissionScore(state.missionIdx);
  state.missionResults[state.missionIdx]=res;
  state.screen='mission-result';
  render();
}
function nextMission(){
  state.missionIdx++;
  state.drawer=null; state.drawerStep=1; state.wizardData={}; state.wizardErrors={};
  state.flags.addMenuOpen=false;
  state.screen='mission-intro';
  render();
}

function openAdd(kind){
  state.drawer='add-'+kind;
  state.drawerStep=1;
  state.wizardData={};
  state.wizardErrors={};
  state.flags.addMenuOpen=false;
  state.currentWizardKind=kind;
  render();
}
function openComplete(id){
  const rec = state.data.bigSisters.find(b=>b.id===id);
  if(!rec) return;
  state.drawer='complete-big';
  state.drawerStep=1;
  state.activeTargetId=id;
  state.currentWizardKind='big';
  state.wizardData = Object.assign({}, rec);
  BIG_ATTACHMENTS.forEach(a=>{ state.wizardData['att_'+a.key] = !!(rec.attachments&&rec.attachments[a.key]); });
  state.wizardErrors={};
  state.kebabOpenFor=null;
  render();
}
function closeDrawer(){
  state.drawer=null; state.wizardData={}; state.wizardErrors={};
  render();
}

function validateStepAndShowErrors(kind, step){
  const errs = {};
  if(step===1){
    ['name','nationalId','dob','entryDate','governorate','center'].concat(kind==='big'?['phone','email']:[]).forEach(f=>{
      if(!normalize(wd(f,''))) errs[f]='هذا الحقل مطلوب';
    });
    const nid = normalize(wd('nationalId',''));
    if(nid && !/^\d{14}$/.test(nid)) errs.nationalId='الرقم القومي غير صحيح';
    if(kind==='big'){
      const ph = normalize(wd('phone',''));
      if(ph && !/^(010|011|012|015)\d{8}$/.test(ph)) errs.phone='رقم التواصل يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015';
    }
    const nm = normalize(wd('name',''));
    if(nm && nm.length<11) errs.name='الاسم يجب أن يكون 11 حرفا على الأقل';
  }
  state.wizardErrors = errs;
  return Object.keys(errs).length===0;
}
function wizardNext(){
  const kind = state.currentWizardKind;
  if(!validateStepAndShowErrors(kind, state.drawerStep)){ render(); return; }
  state.drawerStep++;
  render();
}
function wizardPrev(){ state.drawerStep--; render(); }
function wizardDraft(){
  const missionId = MISSIONS[state.missionIdx].id;
  state.flags['draft_'+missionId] = true;
  state.drawer=null;
  toast('تم الحفظ كمسودة');
}
function collectFinalData(kind){
  const out = {};
  const keys = kind==='big'?
    ['name','nationalId','dob','phone','email','entryDate','governorate','center','village','uniType','university','college','department','year','participatedBefore','role','cycle']:
    ['name','nationalId','dob','phone','entryDate','governorate','center','village','school','grade','participatedBefore'];
  keys.forEach(k=>{ out[k]=wd(k,''); });
  return out;
}
function wizardSubmit(){
  const kind = state.currentWizardKind;
  if(!validateStepAndShowErrors(kind,1)){ state.drawerStep=1; render(); return; }
  const missionId = MISSIONS[state.missionIdx].id;
  const finalData = collectFinalData(kind);
  const attachments = {};
  (kind==='big'?BIG_ATTACHMENTS:LITTLE_ATTACHMENTS).forEach(a=>{ attachments[a.key]=!!wd('att_'+a.key,false); });

  if(state.drawer==='complete-big'){
    const rec = state.data.bigSisters.find(b=>b.id===state.activeTargetId);
    if(rec){
      Object.assign(rec, finalData);
      rec.attachments = attachments;
      rec.status='under_review';
      delete rec.returnNote;
      state.flags.completeSubmitted = true;
    }
    toast(`تم ارسال طلب إضافة أخت كبرى "${rec.name}"، سوف يتم الرد عليكم في اقرب وقت`);
  } else {
    const id = MISSIONS[state.missionIdx].resultId || ('new-'+kind+'-'+Date.now());
    const rec = Object.assign({id, status:'under_review', attachments}, finalData);
    if(kind==='big') state.data.bigSisters.push(rec); else state.data.littleSisters.push(rec);
    state.flags['submitted_'+missionId] = true;
    state.flags['finalData_'+missionId] = finalData;
    toast(`تم ارسال طلب إضافة أخت ${kind==='big'?'كبرى':'صغرى'} "${finalData.name}"، سوف يتم الرد عليكم في اقرب وقت`);
  }
  state.drawer=null;
  render();
  setTimeout(finishCurrentMission, 900);
}

function toggleKebab(id){ state.kebabOpenFor = state.kebabOpenFor===id? null: id; render(); }
function rowMenuClick(id, menu){
  state.kebabOpenFor=null;
  const missionId = MISSIONS[state.missionIdx].id;
  const rec = state.data.bigSisters.find(b=>b.id===id) || state.data.littleSisters.find(l=>l.id===id);
  if(menu==='exit'){
    if(missionId==='exit'){
      state.flags.exitCorrectTarget = (id === MISSIONS[state.missionIdx].expected.targetId);
    }
    state.activeTargetId=id;
    state.exitForm={};
    state.drawer='exit-big';
  } else if(menu==='complete'){
    if(missionId==='complete'){
      state.flags.completeUsedRightMenu = (id === MISSIONS[state.missionIdx].expected.targetId);
      state.flags.completeOpenedCorrect = (id === MISSIONS[state.missionIdx].expected.targetId);
    }
    openComplete(id);
    return;
  } else if(menu==='details'){
    toast(`عرض تفاصيل: ${rec?rec.name:''}`);
  } else if(menu==='resend'){
    toast('تم إرسال رسالة التفعيل');
  }
  render();
}

function toggleAttachment(key){
  const cur = !!wd('att_'+key, false);
  state.wizardData['att_'+key] = !cur;
  render();
}

function exitSubmit(){
  state.modal='confirm-exit';
  render();
}
function confirmExit(){
  const rec = state.data.bigSisters.find(b=>b.id===state.activeTargetId);
  const missionId = MISSIONS[state.missionIdx].id;
  if(rec){
    rec.status='under_review';
    rec.exitReason = state.exitForm.reason;
    rec.exitDate = state.exitForm.exitDate;
    if(missionId==='exit'){
      state.flags.exitReasonUsed = state.exitForm.reason;
      state.flags.exitDateUsed = state.exitForm.exitDate;
      state.flags.exitSubmitted = true;
    }
    toast(`تم ارسال طلب خروج الأخت الكبرى "${rec.name}"، سوف يتم الرد عليكم في اقرب وقت`);
  }
  state.modal=null;
  state.drawer=null;
  render();
  setTimeout(finishCurrentMission, 900);
}

function pickBig(id){
  const rec = state.data.bigSisters.find(b=>b.id===id);
  state.linkPicker.bigId=id;
  state.linkPicker.bigQuery = rec.name;
  state.linkPicker.bigOpen=false;
  render();
}
function pickLittle(id){
  const rec = state.data.littleSisters.find(l=>l.id===id);
  state.linkPicker.littleId=id;
  state.linkPicker.littleQuery = rec.name;
  state.linkPicker.littleOpen=false;
  render();
}
function doLink(){
  const lp = state.linkPicker;
  const big = state.data.bigSisters.find(b=>b.id===lp.bigId);
  const little = state.data.littleSisters.find(l=>l.id===lp.littleId);
  if(!big||!little) return;
  lp.pairs.push({bigId:big.id, bigName:big.name, littleId:little.id, littleName:little.name});
  lp.bigId=null; lp.littleId=null; lp.bigQuery=''; lp.littleQuery='';
  toast(`تم ربط الأخت الكبرى "${big.name}" بالأخت الصغرى "${little.name}"`);
}
function unlink(idx){ state.linkPicker.pairs.splice(idx,1); render(); }
function confirmLinkAttempt(){
  const lp = state.linkPicker;
  if(lp.pairs.length < 1){
    state.flags.linkValidationMsg = 'يجب إنشاء رابط واحد على الأقل قبل تأكيد الربط.';
    render();
    return;
  }
  state.flags.linkValidationMsg=null;
  state.modal='confirm-link';
  render();
}
function confirmLinkFinal(){
  state.linkPicker.pairs.forEach(p=>{ state.data.links.push(p); });
  state.linkPicker.confirmed=true;
  state.flags.linkConfirmed=true;
  state.modal=null;
  toast('تم تأكيد الربط بنجاح');
  render();
  setTimeout(finishCurrentMission, 900);
}

/* ---------- event delegation ---------- */
appEl.addEventListener('input', e=>{
  const f = e.target.dataset.field;
  if(!f) return;
  if(f==='traineeName'){ state.traineeName = e.target.value; return; }
  if(f==='link_big_query'){ state.linkPicker.bigQuery = e.target.value; state.linkPicker.bigId=null; state.linkPicker.bigOpen=true; render(); state._focusAfterRender = e.target.dataset.field ? e.target.id : null; return; }
  if(f==='link_little_query'){ state.linkPicker.littleQuery = e.target.value; state.linkPicker.littleId=null; state.linkPicker.littleOpen=true; render(); return; }
  if(f==='exit_notes'){ state.exitForm.notes = e.target.value; return; }
  state.wizardData[f] = e.target.value;
  if(state.wizardErrors[f]){ e.target.classList.remove('error'); const err=e.target.parentElement.querySelector('.field-error'); if(err) err.remove(); delete state.wizardErrors[f]; }
});
appEl.addEventListener('change', e=>{
  const f = e.target.dataset.field;
  if(!f) return;
  if(f==='exit_reason'){ state.exitForm.reason = e.target.value; render(); return; }
  if(f==='exit_date'){ state.exitForm.exitDate = e.target.value; render(); return; }
  state.wizardData[f] = e.target.value;
  if(f==='governorate'){ state.wizardData.center=''; state.wizardData.village=''; }
  if(f==='center'){ state.wizardData.village=''; }
  if(f==='uniType'){ state.wizardData.university=''; }
  render();
});
document.addEventListener('click', e=>{
  const picker = e.target.closest && e.target.closest('.picker-box');
  if(!picker){
    if(state.linkPicker.bigOpen || state.linkPicker.littleOpen){ state.linkPicker.bigOpen=false; state.linkPicker.littleOpen=false; render(); }
  }
  const kebab = e.target.closest && e.target.closest('.kebab-wrap');
  if(!kebab && state.kebabOpenFor){ state.kebabOpenFor=null; render(); }
  const addMenu = e.target.closest && e.target.closest('[data-action="toggle-add-menu"]');
  if(!addMenu && state.flags.addMenuOpen && !(e.target.closest && e.target.closest('.kebab-menu'))){ state.flags.addMenuOpen=false; render(); }
});
appEl.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const d = t.dataset;
  if(action==='noop' && e.target===t) return;
  if(t.disabled) return;
  switch(action){
    case 'start-assessment': startAssessment(); break;
    case 'begin-mission': beginMission(); break;
    case 'next-mission': nextMission(); break;
    case 'go-final-report': state.screen='final-report'; render(); break;
    case 'print-report': window.print(); break;
    case 'nav':
      state.appScreen = d.screen;
      state.kebabOpenFor=null;
      state.flags.addMenuOpen=false;
      if(d.screen==='girls-big') state.girlsTab='big';
      if(d.screen==='girls-little') state.girlsTab='little';
      render();
      break;
    case 'toggle-requests-nav': state.navRequestsOpen=!state.navRequestsOpen; render(); break;
    case 'toggle-add-menu': state.flags.addMenuOpen=!state.flags.addMenuOpen; render(); break;
    case 'open-add': openAdd(d.kind); break;
    case 'close-drawer': closeDrawer(); break;
    case 'wizard-next': wizardNext(); break;
    case 'wizard-prev': wizardPrev(); break;
    case 'wizard-draft': wizardDraft(); break;
    case 'wizard-submit': wizardSubmit(); break;
    case 'toggle-attachment': toggleAttachment(d.key); break;
    case 'toggle-kebab': toggleKebab(d.id); break;
    case 'row-menu-click': rowMenuClick(d.id, d.menu); break;
    case 'exit-submit': exitSubmit(); break;
    case 'confirm-exit': confirmExit(); break;
    case 'close-modal': state.modal=null; render(); break;
    case 'pick-big': pickBig(d.id); break;
    case 'pick-little': pickLittle(d.id); break;
    case 'do-link': doLink(); break;
    case 'unlink': unlink(parseInt(d.idx,10)); break;
    case 'confirm-link-attempt': confirmLinkAttempt(); break;
    case 'confirm-link-final': confirmLinkFinal(); break;
    case 'dismiss-toast': state.toast=null; render(); break;
  }
});

/* ---------- init ---------- */
function init(){
  render();
}
init();
</script>
</body>
</html>
