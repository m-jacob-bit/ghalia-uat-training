<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>تقييم مشروع ابنتي الغالية — FC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Almarai:wght@300;400;700;800&display=swap">
<style id="app-style">
:root{
  --bg:#f7f7fb;
  --surface:#ffffff;
  --surface-2:#f1f1f8;
  --border:#e3e3ee;
  --text:#1c1b29;
  --text-muted:#6b6b7f;
  --text-faint:#9a99ad;
  --primary:#4338ca;
  --primary-hover:#3730a3;
  --primary-soft:#eef0fd;
  --amber:#f59e0b;
  --success:#16a34a;
  --success-soft:#dcfce7;
  --warning:#d97706;
  --warning-soft:#fef3c7;
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --neutral:#6b7280;
  --neutral-soft:#e5e7eb;
  --shadow:0 1px 2px rgba(28,27,41,.06),0 8px 24px -12px rgba(28,27,41,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131220;
    --surface:#1b1a2c;
    --surface-2:#211f36;
    --border:#312e4d;
    --text:#eeedf7;
    --text-muted:#a6a4c0;
    --text-faint:#7d7b98;
    --primary:#8385f5;
    --primary-hover:#9698ff;
    --primary-soft:#26234a;
    --amber:#fbbf24;
    --success:#4ade80;
    --success-soft:#153524;
    --warning:#fbbf24;
    --warning-soft:#3a2c0c;
    --danger:#f87171;
    --danger-soft:#3b1a1a;
    --neutral:#9c9bb5;
    --neutral-soft:#2a2843;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#131220;
  --surface:#1b1a2c;
  --surface-2:#211f36;
  --border:#312e4d;
  --text:#eeedf7;
  --text-muted:#a6a4c0;
  --text-faint:#7d7b98;
  --primary:#8385f5;
  --primary-hover:#9698ff;
  --primary-soft:#26234a;
  --amber:#fbbf24;
  --success:#4ade80;
  --success-soft:#153524;
  --warning:#fbbf24;
  --warning-soft:#3a2c0c;
  --danger:#f87171;
  --danger-soft:#3b1a1a;
  --neutral:#9c9bb5;
  --neutral-soft:#2a2843;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Almarai','Cairo',sans-serif;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh}
h1,h2,h3,h4{font-family:'Cairo','Almarai',sans-serif;text-wrap:balance;margin:0}
button{font-family:inherit}
a{color:var(--primary)}
::selection{background:var(--primary-soft)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.panel{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:36px 32px}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;flex-shrink:0}
.brand-text .ar{font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:var(--text)}
.brand-text .en{font-size:12px;color:var(--text-faint);letter-spacing:.03em}
.panel h1{font-size:22px;font-weight:800;margin-bottom:8px}
.panel .lead{color:var(--text-muted);margin-bottom:22px;font-size:14.5px}
.field-group{margin-bottom:16px}
.field-label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--text)}
.field-label .opt{font-weight:400;color:var(--text-faint);font-size:12px}
.field-label .req{color:var(--danger);margin-inline-start:2px}
.field-hint{font-size:12px;color:var(--text-faint);margin-top:4px}
.field-error{font-size:12.5px;color:var(--danger);margin-top:5px;display:flex;align-items:center;gap:5px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);
  color:var(--text);font-size:14.5px;font-family:inherit;transition:border-color .12s;
}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b6b7f' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 12px center;padding-inline-start:34px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
input.error,select.error{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:9px;font-size:14.5px;font-weight:700;border:1.5px solid transparent;cursor:pointer;transition:transform .06s,background .12s,border-color .12s;font-family:'Cairo','Almarai',sans-serif;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{background:var(--primary-soft);color:var(--text-faint);cursor:not-allowed}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:transparent;padding:8px 12px}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:13px}

.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:2px}
.sidebar.collapsed{width:64px}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:600;border:none;background:none;width:100%;text-align:right;font-family:inherit}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-sub{padding-inline-start:20px;display:flex;flex-direction:column;gap:2px;margin-top:2px;margin-bottom:4px}
.nav-sub .nav-item{font-size:13.5px;padding:8px 12px}
.nav-group-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:600;user-select:none}
.nav-group-toggle:hover{background:var(--surface-2)}
.nav-chevron{transition:transform .15s}
.nav-chevron.open{transform:rotate(90deg)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cairo',sans-serif;font-size:13px;flex-shrink:0}
.content{flex:1;padding:26px 30px;overflow-x:auto}
.content-inner{max-width:1080px}

.page-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:800}
.tab-toggle{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.tab-toggle button{border:none;background:none;padding:8px 16px;border-radius:7px;font-weight:700;font-size:13.5px;color:var(--text-muted);cursor:pointer;font-family:'Cairo',sans-serif}
.tab-toggle button.active{background:var(--primary);color:#fff}

.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface-2);color:var(--text-muted);font-size:13px;font-weight:700;border:1.5px solid transparent;cursor:default}
.chip .n{font-variant-numeric:tabular-nums;margin-inline-start:4px;opacity:.75}
.chip.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.search-row{display:flex;gap:10px;margin-bottom:14px;align-items:center}
.search-row input{flex:1}

table{width:100%;border-collapse:collapse;font-size:13.8px}
th{text-align:right;padding:11px 14px;color:var(--text-faint);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.name-cell{font-weight:700}
.empty-state{padding:56px 20px;text-align:center;color:var(--text-faint)}
.empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.5}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.badge .dot{width:6px;height:6px;border-radius:50%}
.badge-approved{background:var(--success-soft);color:var(--success)}
.badge-approved .dot{background:var(--success)}
.badge-review{background:var(--warning-soft);color:var(--warning)}
.badge-review .dot{background:var(--warning)}
.badge-returned{background:var(--warning-soft);color:var(--warning)}
.badge-returned .dot{background:var(--danger)}
.badge-rejected{background:var(--danger-soft);color:var(--danger)}
.badge-rejected .dot{background:var(--danger)}
.badge-draft{background:var(--neutral-soft);color:var(--neutral)}
.badge-draft .dot{background:var(--neutral)}

.kebab-wrap{position:relative;display:inline-block}
.kebab-btn{width:30px;height:30px;border-radius:7px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:18px}
.kebab-btn:hover{background:var(--surface-2)}
.kebab-menu{position:absolute;left:0;top:34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:40;min-width:210px;padding:6px;text-align:right}
.kebab-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:none;background:none;text-align:right;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
.kebab-menu button:hover{background:var(--surface-2)}
.kebab-menu button.danger{color:var(--danger)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,14,25,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:460px;box-shadow:var(--shadow);overflow:hidden}
.modal-header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-icon{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:18px 20px;font-size:14px;color:var(--text-muted);line-height:1.7}
.modal-body strong{color:var(--text)}
.modal-footer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);justify-content:flex-end}

.drawer-overlay{position:fixed;inset:0;background:rgba(15,14,25,.42);z-index:90;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:18px}
.close-x:hover{background:var(--surface-2)}
.drawer-body{flex:1;overflow-y:auto;padding:22px}
.drawer-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.field-grid{grid-template-columns:1fr}}
.readonly-field{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--text-muted)}

.upload-grid{display:flex;flex-direction:column;gap:10px}
.upload-box{border:1.5px dashed var(--border);border-radius:10px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;background:var(--surface-2)}
.upload-box.done{border-style:solid;border-color:var(--success);background:var(--success-soft)}
.upload-label{font-size:13.5px;font-weight:700}
.upload-label .req{color:var(--danger)}
.upload-status{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px}
.upload-box.done .upload-status{color:var(--success);font-weight:700}
.upload-remove{width:22px;height:22px;border-radius:6px;border:none;background:none;color:var(--danger);cursor:pointer;font-size:15px;flex-shrink:0}

.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;background:var(--success-soft);color:var(--success);border:1px solid var(--success);border-radius:10px;padding:13px 18px;font-size:13.8px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow);max-width:520px}
.toast .close-x{color:var(--success)}

.score-hero{text-align:center;padding:30px 20px}
.score-ring{width:130px;height:130px;margin:0 auto 14px;position:relative}
.score-num{font-family:'Cairo',sans-serif;font-weight:800;font-size:30px}
.score-label{font-size:13px;color:var(--text-muted);margin-top:4px}
.checklist{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.checklist-item{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.checklist-item .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px}
.checklist-item.ok .ic{background:var(--success)}
.checklist-item.bad .ic{background:var(--danger)}
.checklist-item .txt .t{font-weight:700;font-size:13.8px}
.checklist-item .txt .d{font-size:12.8px;color:var(--text-muted);margin-top:2px}

.report-mission{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.report-mission:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.report-mission-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.report-mission-head .t{font-family:'Cairo',sans-serif;font-weight:700;font-size:15px}
.report-mission-head .s{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px}
.report-actions{border-top:1px solid var(--border);padding-top:20px}

@media print{
  body *{visibility:hidden}
  .print-area, .print-area *{visibility:visible}
  .print-area{position:absolute;inset:0 auto auto 0;width:100%;margin:0;padding:0;max-width:none}
  .no-print{display:none !important}
  .card{box-shadow:none;border:none}
  body{background:#fff;color:#000}
  .checklist-item{break-inside:avoid;border-color:#ccc}
  .report-mission{break-inside:avoid}
}

.mission-progress{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.mp-dot{width:9px;height:9px;border-radius:50%;background:var(--surface-2)}
.mp-dot.done{background:var(--success)}
.mp-dot.current{background:var(--primary)}

.story-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.story-card{max-width:640px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.story-head{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;padding:26px 30px}
.story-eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;opacity:.85;text-transform:uppercase}
.story-title{font-size:23px;font-weight:800;margin-top:6px}
.story-body{padding:26px 30px}
.story-text{font-size:14.5px;line-height:1.85;color:var(--text)}
.casefile{background:var(--surface-2);border-radius:12px;padding:16px 18px;margin-top:18px}
.casefile-title{font-size:12.5px;font-weight:800;color:var(--text-faint);margin-bottom:10px;letter-spacing:.02em}
.casefile-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.casefile-row:last-child{border-bottom:none}
.casefile-row .k{color:var(--text-muted)}
.casefile-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.story-foot{padding:20px 30px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

.result-shell{min-height:100vh;padding:32px 16px;display:flex;justify-content:center}
.result-wrap{max-width:640px;width:100%}
.roster-table-wrap{overflow-x:auto}

@media (max-width:760px){
  .shell{flex-direction:column;min-height:100vh}
  .sidebar{width:100% !important;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-inline-end:none;border-bottom:1px solid var(--border);gap:6px;flex-shrink:0}
  .sidebar-brand{display:none}
  .nav-item{flex-shrink:0;white-space:nowrap;padding:8px 12px}
  .nav-group-toggle{flex-shrink:0;white-space:nowrap;padding:8px 12px}
  .nav-chevron{display:none}
  .nav-sub{flex-direction:row;padding-inline-start:0;margin:0}
  .content{padding:16px}
  .card-pad{padding:16px}
  .topbar{padding:0 14px}
  .page-title-row{align-items:flex-start}
  .page-title{font-size:17px}
  .drawer{max-width:100%}
  .drawer-body{padding:16px}
  .drawer-footer{flex-wrap:wrap;gap:8px}
  .field-grid{grid-template-columns:1fr}
  .panel{padding:26px 20px}
  .story-head,.story-body,.story-foot{padding-left:20px;padding-right:20px}
  table{font-size:12.8px}
  th,td{padding:9px 10px}
}
</style>
</head>
<body>
<div id="app"></div>
<script id="app-logic">
'use strict';

const ASSOCIATION_NAME = 'جمعية النور للتنمية';

const TEAM_ROLES = ['منسق الجمعية','إداري الجمعية'];
const TEAM_EXIT_REASONS = [
  'إنهاء خدمة بسبب مخالفة',
  'استقالة',
  'انتهاء العقد',
  'ظروف طبية أو شخصية',
  'نقل لمشروع أو جهة أخرى'
];
const BIG_RETURN_REASONS = [
  'إقرار سياسة حماية الطفل غير موجود أو غير موقّع.',
  'البيانات المدخلة إلكترونياً لا تطابق الوثائق الرسمية المرفقة.',
  'بطاقة الرقم القومي غير موجودة.',
  'كارنيه الكلية/ شهادة الترشيح في بداية الدراسة الجامعية/نتيجة السنة السابقة غير موجود.',
  'نموذج إقرار ولي الأمر غير موجود أو غير موقّع.',
  'نموذج الإقرار غير موجود أو غير موقّع.',
  'نموذج موافقة التصوير/الفيديو غير موجود أو غير موقّع.'
];
const LITTLE_RETURN_REASONS = [
  'البيانات المدخلة إلكترونياً لا تطابق الوثائق الرسمية المرفقة.',
  'بطاقة ولي الأمر غير موجودة.',

/* ---------- progress persistence (survives accidental refresh) ---------- */
const STORAGE_KEY = 'ghalia-progress-fc-v1';
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      screen: state.screen,
      traineeName: state.traineeName,
      missionIdx: state.missionIdx,
      data: state.data,
      missionResults: state.missionResults,
      flags: state.flags
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || !saved.traineeName) return false;
    Object.assign(state, saved);
    return true;
  }catch(e){ return false; }
}
function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}
function startOver(){
  if(!confirm('هل أنتِ متأكدة من بدء تقييم جديد؟ هيتم حذف كل تقدمك الحالي.')) return;
  clearProgress();
  state = initialState();
  render();
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return d+' / '+m+' / '+y;
}
function normalize(s){ return String(s==null?'':s).trim().replace(/\s+/g,' '); }
function fieldsMatch(a,b){ return normalize(a)===normalize(b) && normalize(a)!==''; }
function wd(field, def){ return state.wizardData[field]!==undefined ? state.wizardData[field] : (def||''); }
function inCycle(d){ return !!d && d>='2026-09-01' && d<='2029-04-30'; }
function lookupName(id){
  const all = [...state.data.bigSisters, ...state.data.littleSisters, ...state.data.teamMembers];
  const r = all.find(x=>x.id===id);
  return r? r.name : null;
}

function teamAddValid(){
  const name = normalize(wd('teamName',''));
  const words = name.split(/\s+/).filter(Boolean);
  if(name.length<11 || words.length<4) return false;
  if(!/^\d{14}$/.test(normalize(wd('teamNationalId','')))) return false;
  if(!wd('teamDob','')) return false;
  if(!/^\d{11}$/.test(normalize(wd('teamPhone','')))) return false;
  const email = normalize(wd('teamEmail',''));
  if(!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) return false;
  if(!wd('teamRole','')) return false;
  if(!inCycle(wd('teamEntryDate',''))) return false;
  if(!wd('att_teamIdFront',false) || !wd('att_teamIdBack',false) || !wd('att_teamContract',false)) return false;
  return true;
}

function scoreColor(score){
  if(score>=85) return 'var(--success)';
  if(score>=60) return 'var(--warning)';
  return 'var(--danger)';
}
function ringSvg(score, size){
  size = size||130;
  const r = size/2 - 9;
  const c = 2*Math.PI*r;
  const off = c - (score/100)*c;
  const color = scoreColor(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

      </div>
      <div class="card-pad report-actions no-print">
        <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:12px">اضغطي الزر لحفظ هذا التقرير كملف PDF (من نافذة الطباعة اختاري «حفظ كـ PDF» بدل الطابعة).</p>
        <button class="btn btn-primary btn-block" data-action="print-report">حفظ التقرير كملف PDF 🖨</button>
      </div>
    </div>
  </div></div>`;
}

function viewedDetailsItem(targetId){
  const viewed = (state.flags.detailsViewedIds||[]).includes(targetId);
  return {label:'فتح تفاصيل الطلب قبل اتخاذ القرار', ok: viewed, detail: viewed?'':'اتُخذ القرار من غير فتح «عرض التفاصيل» للطلب أولًا — الخطوة الأولى دايمًا هي فتح الطلب من القائمة، ومراجعة بياناته كاملة، وبعدين اختيار الإجراء من جوه شاشة الطلب نفسها.'};
}
function scoreReviewForward(m){
  const a = state.flags.lastAction||{};
  const correctTarget = a.targetId===m.expected.targetId;
  const correctAction = a.actionType==='forward';
  const items = [
    viewedDetailsItem(m.expected.targetId),
    {label:'التصرف في الطلب الصحيح ('+lookupNameSeed(m.expected.targetId)+')', ok: correctTarget, detail: correctTarget?'':`تصرّفتِ في طلب «${lookupNameSeed(a.targetId)||'لا شيء'}» بدل الطلب المطلوب. راجعي بيانات الحالة (خصوصًا الرقم القومي) للتأكد من اختيار السجل الصحيح، خصوصًا لو في أكتر من طلب بنفس الاسم.`},
    {label:'استخدام «تقديم للمدير» كإجراء نهائي', ok: correctAction, detail: correctAction?'':`استخدمتِ إجراء «${a.actionType==='return'?'ارجاع الطلب':(a.actionType||'لا شيء')}»، والإجراء الصحيح المطلوب في بيانات الحالة هو «تقديم للمدير» — الطلب كان مكتملًا وسليمًا ولا يحتاج إرجاعًا.`}
  ];
  const score = Math.round(items.filter(i=>i.ok).length/items.length*100);
  return {score, items};
}
function scoreReviewReturn(m){
  const a = state.flags.lastAction||{};
  const correctTarget = a.targetId===m.expected.targetId;
  const correctAction = a.actionType==='return';
  const correctReason = correctAction && fieldsMatch(a.reason, m.expected.reason);
  const items = [
    viewedDetailsItem(m.expected.targetId),
    {label:'التصرف في الطلب الصحيح ('+lookupNameSeed(m.expected.targetId)+')', ok: correctTarget, detail: correctTarget?'':`تصرّفتِ في طلب «${lookupNameSeed(a.targetId)||'لا شيء'}» بدل الطلب المطلوب. راجعي بيانات الحالة (خصوصًا الرقم القومي) للتأكد من اختيار السجل الصحيح.`},
    {label:'استخدام «ارجاع الطلب» كإجراء', ok: correctAction, detail: correctAction?'':`استخدمتِ إجراء «${a.actionType==='forward'?'تقديم للمدير':(a.actionType||'لا شيء')}»، لكن الطلب كان ناقصًا/فيه خطأ ويحتاج «ارجاع الطلب» لتعديله قبل تقديمه.`},
    {label:'اختيار سبب الإرجاع الصحيح', ok: correctReason, detail: correctReason?'':`اخترتِ السبب «${a.reason||'لم يُختر'}»، والسبب الصحيح المذكور في بيانات الحالة هو «${m.expected.reason}».`}
  ];
  const score = Math.round(items.filter(i=>i.ok).length/items.length*100);
  return {score, items};
}
function scoreReviewExitApprove(m){
  const a = state.flags.lastAction||{};
  const correctTarget = a.targetId===m.expected.targetId;
  const correctAction = a.actionType==='approve_exit';
  const items = [
    viewedDetailsItem(m.expected.targetId),
    {label:'الموافقة على طلب الخروج الصحيح ('+lookupNameSeed(m.expected.targetId)+')', ok: correctTarget, detail: correctTarget?'':`تصرّفتِ في طلب «${lookupNameSeed(a.targetId)||'لا شيء'}» بدل الطلب المطلوب. تأكدي من الرقم القومي المذكور في بيانات الحالة قبل اختيار السجل.`},
    {label:'استخدام «موافقة» كإجراء نهائي', ok: correctAction, detail: correctAction?'':'لم تتم الموافقة على طلب الخروج — بيانات الحالة تطلب اعتماده مباشرة بلا إرجاع أو رفض.'}
  ];
  const score = Math.round(items.filter(i=>i.ok).length/items.length*100);
  return {score, items};
}
function scoreTeamAdd(m){
  const exp = m.expected;
  const submitted = !!state.flags.submitted_addteam;
  const finalData = state.flags.finalData_addteam || {};
  const fields = [['name','الاسم رباعي'],['nationalId','الرقم القومي'],['dob','تاريخ الميلاد'],['phone','رقم التواصل'],['email','البريد الإلكتروني'],['role','الدور'],['entryDate','تاريخ الدخول']];
  let correct=0;
  const items = fields.map(([f,label])=>{
    const ok = submitted && fieldsMatch(finalData[f], exp[f]);
    if(ok) correct++;
    const entered = submitted ? (finalData[f]||'(تُركت فارغة)') : '(لم تصل هذه الخانة لأنك لم ترسلي الطلب)';
    return {label, ok, detail: ok?'':`أدخلتِ «${entered}»، والصحيح المطلوب في بيانات الحالة هو «${exp[f]}».`};
  });
  const accuracyPct = Math.round(correct/fields.length*100);
  items.push({label:'إرسال الطلب فعليًا', ok:submitted, detail: submitted?'':'لم تُرسَل بيانات العضو الجديد — لازم تضغطي زر الإرسال النهائي بعد تعبئة النموذج.'});
  const score = submitted? Math.round(accuracyPct*0.85 + 15) : Math.round(accuracyPct*0.5);
  return {score, items};
}
function scoreTeamExit(m){
  const exp = m.expected;
  const correctTarget = !!state.flags.teamExitCorrectTarget;
  const correctReason = fieldsMatch(state.flags.teamExitReasonUsed, exp.reason);
  const correctDate = state.flags.teamExitDateUsed===exp.exitDate;
  const submitted = !!state.flags.teamExitSubmitted;
  const items = [
    {label:'اختيار العضو الصحيح ('+lookupNameSeed(exp.targetId)+')', ok: correctTarget, detail: correctTarget?'':'قدّمتِ طلب الخروج لعضو مختلف عن المطلوب — راجعي بيانات الحالة وتأكدي من اسم العضو قبل تقديم الطلب.'},
    {label:'اختيار سبب الخروج الصحيح ('+exp.reason+')', ok: correctReason, detail: correctReason?'':`اخترتِ السبب «${state.flags.teamExitReasonUsed||'لم يُختر'}»، والصحيح المذكور في بيانات الحالة هو «${exp.reason}».`},
    {label:'إدخال تاريخ الخروج الصحيح', ok: correctDate, detail: correctDate?'':`أدخلتِ التاريخ «${fmtDate(state.flags.teamExitDateUsed)||'لم يُدخل'}»، والتاريخ الصحيح هو ${fmtDate(exp.exitDate)}.`},
    {label:'إرسال الطلب وتأكيده', ok: submitted, detail: submitted?'':'تعبئة النموذج وحدها لا تكفي — لازم تضغطي زر الإرسال وتؤكدي طلب الخروج حتى يُحتسب.'}
  ];
  const score = Math.round(items.filter(i=>i.ok).length/items.length*100);
  return {score, items};
}
function lookupNameSeed(id){
  const seed = freshSeed();
  const all = [...seed.bigSisters, ...seed.littleSisters, ...seed.teamMembers];
  const r = all.find(x=>x.id===id);
  return r? r.name : (id||'');
}
function computeMissionScore(idx){
  const m = MISSIONS[idx];
  if(m.id==='approve-bs-entry') return scoreReviewForward(m);
  if(m.id==='return-ls-entry') return scoreReviewReturn(m);
  if(m.id==='approve-bs-exit') return scoreReviewExitApprove(m);
  if(m.id==='add-team-member') return scoreTeamAdd(m);
  if(m.id==='exit-team-member') return scoreTeamExit(m);
}

function toast(msg){ state.toast = msg; render(); setTimeout(()=>{ if(state.toast===msg){ state.toast=null; render(); } }, 4500); }

function startAssessment(){
  if(!normalize(state.traineeName)){ toast('برجاء إدخال الاسم أولاً'); return; }
  state.screen='mission-intro';
  state.missionIdx=0;
  render();
}
function beginMission(){
  const m = MISSIONS[state.missionIdx];
  state.screen='app';
  state.appScreen=m.startAppScreen;
  state.drawer=null;
  render();
}
function finishCurrentMission(){
  const res = computeMissionScore(state.missionIdx);
  state.missionResults[state.missionIdx]=res;
  state.screen='mission-result';
  render();
}
function nextMission(){
  state.missionIdx++;
  state.drawer=null; state.wizardData={};
  state.screen='mission-intro';
  render();
}

function toggleKebab(id){ state.kebabOpenFor = state.kebabOpenFor===id? null: id; render(); }
function openReview(kind, id, returnMode){
  state.drawer = kind;
  state.activeTargetId = id;
  state.reviewReturnMode = !!returnMode;
  state.reviewForm = {reason:'', comment:''};
  state.kebabOpenFor = null;
  state.flags.detailsViewedIds = state.flags.detailsViewedIds || [];
  if(!state.flags.detailsViewedIds.includes(id)) state.flags.detailsViewedIds.push(id);
  render();
}
function rowMenuClick(id, menu){
  if(menu==='details'){ state.kebabOpenFor=null; toast('عرض التفاصيل: '+(lookupName(id)||'')); return; }
  if(menu==='review-entry-big'){ openReview('review-big-entry', id, false); return; }
  if(menu==='review-exit-big'){ openReview('review-big-exit', id, false); return; }
  if(menu==='review-entry-little'){ openReview('review-little-entry', id, false); return; }
  state.kebabOpenFor=null; render();
}
function closeDrawer(){ state.drawer=null; state.wizardData={}; render(); }
function reviewShowReturn(){ state.reviewReturnMode=true; render(); }
function reviewCancelReturn(){ state.reviewReturnMode=false; render(); }
function reviewForward(){ state.modal='confirm-forward'; render(); }
function reviewApproveExit(){ state.modal='confirm-approve-exit'; render(); }
function reviewSubmitReturn(){
  if(!state.reviewForm.reason) return;
  const isBig = state.drawer==='review-big-entry';
  const list = isBig? state.data.bigSisters : state.data.littleSisters;
  const rec = list.find(r=>r.id===state.activeTargetId);
  if(rec){
    rec.status='returned';
    rec.returnReason = state.reviewForm.reason;
    state.flags.lastAction = {targetId:rec.id, actionType:'return', reason: state.reviewForm.reason};
    toast('تم ارجاع الطلب');
  }
  state.drawer=null;
  render();
  setTimeout(finishCurrentMission,900);
}
function confirmForward(){
  const isBig = state.drawer==='review-big-entry';
  const list = isBig? state.data.bigSisters : state.data.littleSisters;
  const rec = list.find(r=>r.id===state.activeTargetId);
  if(rec){
    rec.status='pending_apm';
    state.flags.lastAction = {targetId:rec.id, actionType:'forward'};
    toast('تم تقديم الطلب لمديرة المنطقة');
  }
  state.modal=null; state.drawer=null;
  render();
  setTimeout(finishCurrentMission,900);
}
function confirmApproveExit(){
  const rec = state.data.bigSisters.find(r=>r.id===state.activeTargetId);
  if(rec){
    rec.status='pending_apm';
    state.flags.lastAction = {targetId:rec.id, actionType:'approve_exit'};
    toast('تمت الموافقة على طلب الخروج');
  }
  state.modal=null; state.drawer=null;
  render();
  setTimeout(finishCurrentMission,900);
}

function openTeamAdd(){ state.drawer='team-add'; state.wizardData={}; render(); }
function openTeamExit(id){ state.drawer='team-exit'; state.activeTargetId=id; state.teamExitForm={}; state.kebabOpenFor=null; render(); }
function teamMenuClick(id, menu){
  if(menu==='details'){ state.kebabOpenFor=null; toast('عرض التفاصيل: '+(lookupName(id)||'')); return; }
  if(menu==='resend'){ state.kebabOpenFor=null; toast('تم إعادة إرسال رمز التحقق بنجاح'); return; }
  if(menu==='exit'){ openTeamExit(id); return; }
  state.kebabOpenFor=null; render();
}
function toggleAttachment(key){
  const cur = !!wd('att_'+key, false);
  state.wizardData['att_'+key] = !cur;
  render();
}
function teamAddSubmit(){ if(!teamAddValid()) return; state.modal='confirm-team-add'; render(); }
function confirmTeamAdd(){
  const rec = {
    id:'team-new-'+Date.now(),
    name: normalize(wd('teamName')),
    role: wd('teamRole'),
    phone: wd('teamPhone'),
    email: wd('teamEmail'),
    nationalId: wd('teamNationalId'),
    dob: wd('teamDob'),
    entryDate: wd('teamEntryDate'),
    association: ASSOCIATION_NAME,
    status:'pending_apm'
  };
  state.data.teamMembers.push(rec);
  const missionId = MISSIONS[state.missionIdx].id;
  if(missionId==='add-team-member'){
    state.flags.submitted_addteam = true;
    state.flags.finalData_addteam = {name:rec.name,nationalId:rec.nationalId,dob:rec.dob,phone:rec.phone,email:rec.email,role:rec.role,entryDate:rec.entryDate};
  }
  toast(`تم إرسال طلب إضافة عضو "${rec.name}"، سوف يتم الرد عليكم في أقرب وقت`);
  state.modal=null; state.drawer=null;
  render();
  setTimeout(finishCurrentMission,900);
}
function teamExitSubmit(){ state.modal='confirm-team-exit'; render(); }
function confirmTeamExit(){
  const rec = state.data.teamMembers.find(m=>m.id===state.activeTargetId);
  if(rec){
    rec.status='pending_apm';
    rec.exitReason = state.teamExitForm.reason;
    rec.exitDate = state.teamExitForm.exitDate;
    const missionId = MISSIONS[state.missionIdx].id;
    const exp = MISSIONS[state.missionIdx].expected;
    if(missionId==='exit-team-member'){
      state.flags.teamExitCorrectTarget = (rec.id === exp.targetId);
      state.flags.teamExitReasonUsed = state.teamExitForm.reason;
      state.flags.teamExitDateUsed = state.teamExitForm.exitDate;
      state.flags.teamExitSubmitted = true;
    }
    toast(`تم ارسال طلب خروج العضو "${rec.name}". سوف يتم الرد عليكم في أقرب وقت`);
  }
  state.modal=null; state.drawer=null;
  render();
  setTimeout(finishCurrentMission,900);
}

appEl.addEventListener('input', e=>{
  const f = e.target.dataset.field;
  if(!f) return;
  if(f==='traineeName'){ state.traineeName = e.target.value; return; }
  if(f==='review_comment'){ state.reviewForm.comment = e.target.value; return; }
  if(f==='team_exit_notes'){ state.teamExitForm.notes = e.target.value; return; }
  state.wizardData[f] = e.target.value;
});
appEl.addEventListener('change', e=>{
  const f = e.target.dataset.field;
  if(!f) return;
  if(f==='review_reason'){ state.reviewForm.reason = e.target.value; render(); return; }
  if(f==='team_exit_reason'){ state.teamExitForm.reason = e.target.value; render(); return; }
  if(f==='team_exit_date'){ state.teamExitForm.exitDate = e.target.value; render(); return; }
  state.wizardData[f] = e.target.value;
  render();
});
document.addEventListener('click', e=>{
  const kebab = e.target.closest && e.target.closest('.kebab-wrap');
  if(!kebab && state.kebabOpenFor){ state.kebabOpenFor=null; render(); }
});
appEl.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const d = t.dataset;
  if(action==='noop' && e.target===t) return;
  if(t.disabled) return;
  switch(action){
    case 'start-assessment': startAssessment(); break;
    case 'begin-mission': beginMission(); break;
    case 'next-mission': nextMission(); break;
    case 'go-final-report': state.screen='final-report'; render(); break;
    case 'print-report': window.print(); break;
    case 'nav':
      state.appScreen = d.screen;
      state.kebabOpenFor=null;
      render();
      break;
    case 'toggle-requests-nav': state.navRequestsOpen=!state.navRequestsOpen; render(); break;
    case 'toggle-kebab': toggleKebab(d.id); break;
    case 'row-menu-click': rowMenuClick(d.id, d.menu); break;
    case 'team-menu-click': teamMenuClick(d.id, d.menu); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-modal': state.modal=null; render(); break;
    case 'review-show-return': reviewShowReturn(); break;
    case 'review-cancel-return': reviewCancelReturn(); break;
    case 'review-forward': reviewForward(); break;
    case 'review-approve-exit': reviewApproveExit(); break;
    case 'review-submit-return': reviewSubmitReturn(); break;
    case 'confirm-forward': confirmForward(); break;
    case 'confirm-approve-exit': confirmApproveExit(); break;
    case 'open-team-add': openTeamAdd(); break;
    case 'team-add-submit': teamAddSubmit(); break;
    case 'confirm-team-add': confirmTeamAdd(); break;
    case 'team-exit-submit': teamExitSubmit(); break;
    case 'confirm-team-exit': confirmTeamExit(); break;
    case 'toggle-attachment': toggleAttachment(d.key); break;
    case 'dismiss-toast': state.toast=null; render(); break;
    case 'start-over': startOver(); break;
  }
});

function init(){ loadProgress(); render(); }
init();
</script>
</body>
</html>
